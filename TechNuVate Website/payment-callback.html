<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Callback — TechNuVate</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background: #f5f7ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 48px;
        margin-bottom: 20px;
        display: block;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 12px;
      }
      .message {
        font-size: 15px;
        color: #6b7280;
        line-height: 1.7;
        margin-bottom: 8px;
      }
      .ref {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 16px;
        word-break: break-all;
      }
      .spinner-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e4e8f0;
        border-top-color: #1b3a7a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .state-success .title {
        color: #15803d;
      }
      .state-failed .title {
        color: #b91c1c;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
    <div class="card" id="callbackCard">
      <!-- Loading state — replaced by JS -->
      <div class="spinner-wrap">
        <div class="spinner"></div>
      </div>
      <p class="title">Confirming your payment...</p>
      <p class="message">Please wait while we verify your transaction.</p>
    </div>

    <script type="module">
      import { confirmPayment } from './scripts/services/payment-callback.service.js';
      import { extractServerMessage } from './scripts/utils/server-message.js';
      import { resolveClientRedirect } from './scripts/utils/payment-redirect.js';

      (async function () {
        var card = document.getElementById('callbackCard');
        var params = new URLSearchParams(window.location.search);
        var status = params.get('status');
        var txRef = params.get('tx_ref');
        var transactionId = params.get('transaction_id');

        if (!txRef || !status) {
          card.innerHTML =
            '<span class="icon"><i class="bi bi-exclamation-triangle-fill" style="color: #f59e0b;"></i></span>' +
            '<p class="title">Nothing to confirm</p>' +
            '<p class="message">This page is only accessible after completing a payment.</p>';
          return;
        }

        if (status === 'cancelled') {
          card.innerHTML =
            '<span class="icon"><i class="bi bi-arrow-return-left"></i></span>' +
            '<p class="title">Payment cancelled</p>' +
            '<p class="message">You cancelled the payment. No charge was made.</p>' +
            '<p class="ref">Ref: ' + escapeHtml(txRef) + '</p>';
          return;
        }

        try {
          var result = await confirmPayment(txRef, transactionId);
          if (!result) {
            card.innerHTML =
              '<span class="icon"><i class="bi bi-question-lg" style="color: #dc2626;"></i></span>' +
              '<p class="title">Unknown payment type</p>' +
              '<p class="message">We could not identify this transaction. Please contact support.</p>' +
              '<p class="ref">Ref: ' + escapeHtml(txRef) + '</p>';
            return;
          }

          if (result.ok && result.body && result.body.success) {
            var message = extractServerMessage(result.body) ||
              'Your payment has been confirmed. Thank you.';
            card.className = 'card state-success';
            card.innerHTML =
              '<span class="icon"><i class="bi bi-check-square-fill" style="color: #15803d;"></i></span>' +
              '<p class="title">Payment confirmed</p>' +
              '<p class="message">' + escapeHtml(message) + '</p>' +
              '<p class="ref">Ref: ' + escapeHtml(txRef) + '</p>';

            var redirectPath = resolveClientRedirect(txRef);
            if (redirectPath) {
              setTimeout(function () {
                window.location.href = redirectPath;
              }, 10000);
            }
          } else {
            var errorMessage = extractServerMessage(result.body) ||
              'Your payment was received but we could not confirm it automatically. ' +
              'Please contact us with your reference below.';
            card.className = 'card state-failed';
            card.innerHTML =
              '<span class="icon"><i class="bi bi-exclamation-triangle-fill" style="color: #f59e0b;"></i></span>' +
              '<p class="title">Confirmation pending</p>' +
              '<p class="message">' + escapeHtml(errorMessage) + '</p>' +
              '<p class="ref">Ref: ' + escapeHtml(txRef) + '</p>';
          }
        } catch (error) {
          card.className = 'card state-failed';
          card.innerHTML =
            '<span class="icon"><i class="bi bi-exclamation-triangle-fill" style="color: #f59e0b;"></i></span>' +
            '<p class="title">Something went wrong</p>' +
            '<p class="message">' +
            'We could not reach our server to confirm your payment. ' +
            'Do not worry — if your payment was successful it will be processed. ' +
            'Contact us with the reference below.</p>' +
            '<p class="ref">Ref: ' + escapeHtml(txRef) + '</p>';
        }
      })();

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    </script>
  </body>
</html>
